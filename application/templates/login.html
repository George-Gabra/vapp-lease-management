<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - vAPP Lease Management</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='APP-icon.png') }}">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f7f9;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .logo-header {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 0;
        }

        .logo-header img {
            height: 1.5em;
            margin-right: 10px;
        }

        .logo-header h1 {
            margin: 0;
            color: #2c3e50;
        }

        .center-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        form {
            background-color: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            width: 320px;
        }

        label {
            display: block;
            margin-bottom: 5px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 8px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 5px;
            background-color: #3498db;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #2980b9;
        }

        .error {
            color: red;
            text-align: center;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="logo-header">
        <img src="{{ url_for('static', filename='App-icon.png') }}" alt="App Icon">
        <h1>vAPP Lease Management</h1>
    </div>

    <div class="center-container">
        <form method="POST" action="{{ url_for('login_page') }}">
            {% if error %}
                <p class="error">{{ error }}</p>
            {% endif %}

            <label for="username">Username:</label>
            <input type="text" name="username" required>

            <label for="password">Password:</label>
            <input type="password" name="password" required>

            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
