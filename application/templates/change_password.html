<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Change Password - vAPP Lease Management</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='App-icon.png') }}">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background-color: #f4f7f9;
            color: #333;
        }

        h1, h2 {
            color: #2c3e50;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .header-bar img {
            height: 1.5em;
            margin-right: 10px;
        }

        .nav-links {
            text-align: right;
            margin-bottom: 20px;
        }

        .nav-links a {
            font-weight: bold;
            margin-left: 15px;
            color: #2c3e50;
            text-decoration: none;
        }

        .nav-links a.logout {
            color: #e74c3c;
        }

        .form-container {
            background-color: #fff;
            padding: 20px;
            margin-bottom: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            max-width: 500px;
        }

        label {
            display: inline-block;
            width: 180px;
            margin-bottom: 10px;
        }

        input[type="password"] {
            width: 200px;
            padding: 5px;
            margin-bottom: 10px;
        }

        button {
            margin-top: 10px;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            background-color: #3498db;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .error {
            color: red;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <div style="display: flex; align-items: center;">
            <img src="{{ url_for('static', filename='App-icon.png') }}" alt="App Icon">
            <h1 style="margin: 0;">vAPP Lease Management</h1>
        </div>
        <div class="nav-links">
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('user_management') }}">Manage Users</a>
            <a href="{{ url_for('logout') }}" class="logout">Logout</a>
        </div>
    </div>

    <h2>Change Your Password</h2>

    <div class="form-container">
        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form method="POST">
            <label for="current_password">Current Password:</label>
            <input type="password" name="current_password" id="current_password" required><br>

            <label for="new_password">New Password:</label>
            <input type="password" name="new_password" id="new_password" required><br>

            <label for="confirm_password">Confirm New Password:</label>
            <input type="password" name="confirm_password" id="confirm_password" required><br>

            <button type="submit">Update Password</button>
        </form>
    </div>

</body>
</html>
